name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    if: false
    name: Evaluate flake
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix build outputs
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: Build Linux checks
        run: |
          nix build \
            .#checks.x86_64-linux.pablo-at-hazel-home \
            .#checks.x86_64-linux.formatting \
            --print-build-logs
