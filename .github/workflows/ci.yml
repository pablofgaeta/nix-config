name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    if: false
    name: Evaluate flake
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix build outputs
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: Build Linux checks
        run: |
          nix build \
            .#checks.x86_64-linux.pablo-at-hazel-home \
            .#checks.x86_64-linux.formatting \
            --print-build-logs
